<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    margin: 0px;
    padding: 0px;
}
body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: magenta;
    display: flex;
    justify-content: center;
    align-items: center;
}
.container{
    width: 100%;
}
.login{
    background-color: aliceblue;
    padding:20px;
    border-radius:20px;
    box-shadow:0px 0px 10px rgb(0,30,0);
}
.login label{
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    width:100px;
}
h1{
    text-align: center;
}
.login input{
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
}
.login button{
    margin-top: 5px;
    width: 100%;
    padding: 12px;
    background-color: green;
    color: white;
    font-size: 25px;
    border-radius: 8px;
}
.login button:hover{
    color: palevioletred;
}  

    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: blueviolet">Login forms</h1>
    
        <form  class="login"action="login.html">

        <lable forms="username">username</lable>
        <input type="text" placeholder="enter name">

        <lable forms="password">password</lable>
        <input type="password" placeholder="enter password">

        <lable forms="re-type password">re-type password</lable>
        <input type="re-type password" placeholder="enter re-type password">
        
        <button type="submit">Register</button>
        <button type="submit">ORDER NOW</button>

        <a href="reg.html">You are order now?</a>

     </form>
    </div>
</body>
</html>
